[project]
name = "adverse_drug_event_discovery"
version = "0.1.0"
description = "Find adverse drug events and the drugs they follow in conversational text, and analyse them as tables in Facthory."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0",
    "pyarrow>=17",
]

[project.scripts]
adverse_drug_event_discovery = "adverse_drug_event_discovery.cli:main"

[dependency-groups]
dev = ["ruff>=0.6", "pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adverse_drug_event_discovery"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"data/generate_sample.py" = ["E501"]
